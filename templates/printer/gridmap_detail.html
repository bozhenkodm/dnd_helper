<!DOCTYPE html>
<html lang="en">
<style>
:root {
  --number-size: calc({{ object.cell_size }}px * 0.2);
}
.container {
  position: relative;
  text-align: center;
  overflow-x: auto; /* Enable horizontal scrolling */
  white-space: nowrap; /* Prevent wrapping inside the container */
}

/* Rotation classes */
.rotate90 {
    transform: rotate(90deg);
}
.rotate180 {
    transform: rotate(180deg);
}
.rotate270 {
    transform: rotate(270deg);
}

/* Table styling */
table {
    {% if object.grid_color == 'none' %}
        border: none;
    {% else %}
        border-collapse: collapse;
        border: 1px solid {{ object.grid_color }};
    {% endif %}
    background-image: url({{ object.base_image.url }});
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    width: max-content; /* Ensure the table does not shrink */
    margin: 0; /* Remove auto-centering to respect horizontal scrolling */
}

/* Cell styling */
td {
    position: relative;
    isolation: isolate;
    text-align: center;
    color: {{ object.grid_color }};
    vertical-align: middle;
    border: 1px solid {{ object.grid_color }};
    width: {{ object.cell_size }}px;
    height: {{ object.cell_size }}px;
    aspect-ratio: 1 / 1;
}

/* Zone background styling */
.zone-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    background-size: cover;
}

/* Participant container */
.participant-container {
    position: relative;
    display: inline-block;
    width: 100%;
    height: 100%;
    cursor: move;
}

/* Participant image styling */
.participant-image {
    position: relative;
    z-index: 2;
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
}
.participant-number {
    position: absolute;
    top: 5%;
    right: 5%;
    z-index: 3;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    border-radius: 50%;
    width: 25%;  /* 25% of participant container width */
    height: 25%; /* 25% of participant container height */
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 100%; /* Relative to container size */
    font-weight: bold;
    pointer-events: none;
    transform: translate(10%, -10%); /* Adjust positioning */
}
.participant-container {
    display: block;
    margin: 0;
    padding: 0;
    line-height: 0; /* Remove line-height spacing */
}
</style>
<head>
    <meta charset="UTF-8">
    <title>{{ object }}</title>
</head>
<body>
<div class="container">
    <table>
        {% for row in object.grid_data %}
        <tr>
            {% for cell in row %}
            <td title="{{ cell.col }}, {{ cell.row }}{% if cell.participant %}; {{ cell.participant.1 }}{% endif %}"
                ondrop="drop(event)"
                ondragover="allowDrop(event)">

                {% if cell.zone %}
                <div class="zone-background"
                     style="background-image: url({{ cell.zone.image_url }}); opacity: {{ cell.zone.opacity }};">
                </div>
                {% endif %}

                {% if cell.participant %}
                <div class="participant-container"
                     draggable="true"
                     ondragstart="drag(event)"
                     ondblclick="rotate(event)"
                     data-participant-id="{{ cell.participant.0 }}">
                    <img class="participant-image rotate{{ cell.participant.3 }}"
                         src="{{ cell.participant.2 }}"
                         style="opacity: {{ cell.participant.4 }}">
                    {% if cell.participant.5 %}
                    <div class="participant-number">{{ cell.participant.5 }}</div>
                    {% endif %}
                </div>
                {% endif %}
            </td>
            {% endfor %}
        </tr>
        {% endfor %}
    </table>
</div>
<script>
function allowDrop(event) {
    event.preventDefault();
}

function rotate(event) {
    event.preventDefault();
    const container = event.target.closest('.participant-container');
    const participantId = container.dataset.participantId;

    // Read current rotation from the image class (e.g. "rotate90").
    const img = container.querySelector('.participant-image');
    const match = img.className.match(/rotate(\d+)/);
    const current = match ? parseInt(match[1], 10) : 0;

    // Rotate counterclockwise when already at 90, clockwise otherwise.
    const clockwise = current !== 90;
    const newRotation = (((current + (clockwise ? 90 : -90)) % 360) + 360) % 360;

    // A participant may span several cells, so update every matching image.
    document
        .querySelectorAll(`[data-participant-id="${participantId}"] .participant-image`)
        .forEach(el => {
            el.classList.remove('rotate0', 'rotate90', 'rotate180', 'rotate270');
            el.classList.add('rotate' + newRotation);
        });

    fetch('/printer/gridmap/{{ object.id }}/update-rotation/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            participant_id: participantId,
            clockwise: clockwise
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(data => console.log('Rotation updated:', data))
    .catch(error => console.error('Error updating rotation:', error));
}

function drag(event) {
    const participantId = event.target.closest('.participant-container').dataset.participantId;
    event.dataTransfer.setData("text", participantId);
    event.target.style.opacity = "0.5";
}

function drop(event) {
    event.preventDefault();
    const participantId = event.dataTransfer.getData("text");
    const draggedContainer = document.querySelector(`[data-participant-id="${participantId}"]`);
    const targetCell = event.target.closest('td');

    if (targetCell) {
        // Reset opacity of dragged element
        draggedContainer.querySelector('img').style.opacity = "";

        // Remove existing participant if present
        const existingContainer = targetCell.querySelector('.participant-container');
        if (existingContainer) existingContainer.remove();

        // Move dragged element to new cell
        targetCell.appendChild(draggedContainer);

        // Calculate new coordinates
        const newRow = targetCell.parentNode.rowIndex + 1;
        const newCol = targetCell.cellIndex + 1;

        // Update position on server
        fetch('/printer/gridmap/{{ object.id }}/update-coords/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                participant_id: participantId,
                new_row: newRow,
                new_col: newCol
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            console.log('Grid updated:', data);
            if (data.remnants) {
                console.log(data.remnants);
                location.reload();
            }
        })
        .catch(error => console.error('Error updating grid:', error));
    }
}
</script>
</body>
</html>
